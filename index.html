<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Shedeggsky — developer, maker, tech enjoyer and Linux guy."
  >

  <meta name="theme-color" content="#7c3aed">

  <title>✦ Shedeggsky</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       VARIABLES
    ========================================================= */

    :root {
      --bg: #070a12;
      --bg-secondary: #0b0f19;

      --card: rgba(17, 24, 39, 0.64);
      --card-hover: rgba(24, 32, 52, 0.82);

      --purple: #a78bfa;
      --purple-dark: #7c3aed;

      --cyan: #22d3ee;
      --green: #34d399;
      --blue: #60a5fa;

      --text: #f8fafc;
      --muted: #94a3b8;

      --border: rgba(167, 139, 250, 0.16);

      --radius: 18px;
    }


    /* =========================================================
       RESET
    ========================================================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 100px;
    }

    body {
      min-height: 100%;
      height: auto;
      overflow-x: hidden;
      overflow-y: auto;

      color: var(--text);

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(124, 58, 237, 0.16),
          transparent 30%
        ),

        radial-gradient(
          circle at 85% 20%,
          rgba(34, 211, 238, 0.10),
          transparent 30%
        ),

        radial-gradient(
          circle at 50% 80%,
          rgba(52, 211, 153, 0.06),
          transparent 35%
        ),

        var(--bg);

      font-family: "Inter", sans-serif;
      line-height: 1.6;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: -2;

      opacity: 0.025;

      background-image:
        linear-gradient(
          rgba(255, 255, 255, 0.8) 1px,
          transparent 1px
        ),

        linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.8) 1px,
          transparent 1px
        );

      background-size: 42px 42px;
    }

    ::selection {
      color: white;
      background: var(--purple-dark);
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
    }


    /* =========================================================
       BACKGROUND
    ========================================================= */

    .background {
      position: fixed;
      inset: 0;

      z-index: -1;

      pointer-events: none;
    }

    .orb {
      position: absolute;

      width: 400px;
      height: 400px;

      border-radius: 50%;

      filter: blur(105px);

      opacity: 0.11;

      animation: float 14s ease-in-out infinite;
    }

    .orb.one {
      top: -170px;
      left: -170px;

      background: var(--purple);
    }

    .orb.two {
      top: 25%;
      right: -190px;

      background: var(--cyan);

      animation-delay: -4s;
    }

    .orb.three {
      bottom: -210px;
      left: 35%;

      background: var(--green);

      animation-delay: -8s;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate(0, 0);
      }

      50% {
        transform: translate(38px, -28px);
      }
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    nav {
      position: sticky;

      top: 16px;

      z-index: 100;

      width: min(920px, 92%);

      margin: 16px auto 0;

      display: flex;

      justify-content: center;

      gap: 6px;

      padding: 8px;

      background: rgba(7, 10, 18, 0.72);

      border: 1px solid var(--border);

      border-radius: 999px;

      backdrop-filter: blur(18px);

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.18);
    }

    nav a {
      color: var(--muted);

      padding: 8px 14px;

      border-radius: 999px;

      font-family: "Fira Code", monospace;

      font-size: 12px;

      transition: 0.2s ease;
    }

    nav a:hover,
    nav a.active {
      color: white;

      background:
        rgba(167, 139, 250, 0.12);
    }


    /* =========================================================
       CONTAINER
    ========================================================= */

    .container {
      width: min(1150px, 92%);

      margin: auto;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 86vh;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 85px 0 70px;

      text-align: center;
    }

    .hero-content {
      width: 100%;

      max-width: 950px;
    }

    .badge {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      margin-bottom: 26px;

      padding: 7px 14px;

      color: var(--muted);

      background:
        rgba(167, 139, 250, 0.07);

      border:
        1px solid var(--border);

      border-radius: 999px;

      font:
        12px "Fira Code",
        monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 12px var(--green);

      animation:
        pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(0.82);
      }
    }

    .hero h1 {
      display: inline-block;

      margin: 0 0 22px;

      /*
        IMPORTANT:
        Extra bottom padding prevents
        "ggy" from touching the next line.
      */

      padding: 0 0 16px;

      color: transparent;

      font-size:
        clamp(54px, 10vw, 112px);

      line-height: 1.1;

      letter-spacing: -4px;

      background:
        linear-gradient(
          120deg,
          var(--purple),
          var(--cyan),
          var(--green)
        );

      -webkit-background-clip: text;
      background-clip: text;

      text-shadow:
        0 0 45px
        rgba(167, 139, 250, 0.08);
    }

    .subtitle {
      color: var(--muted);

      font:
        clamp(13px, 2vw, 17px)
        "Fira Code",
        monospace;
    }

    .typing {
      min-height: 30px;

      margin: 28px auto;

      color: var(--purple);

      font:
        15px "Fira Code",
        monospace;
    }

    .cursor {
      animation:
        blink 0.8s infinite;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    .buttons {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;

      margin-top: 28px;
    }

    .button {
      padding: 12px 20px;

      color: white;

      background:
        rgba(17, 24, 39, 0.62);

      border:
        1px solid var(--border);

      border-radius: 12px;

      font-size: 14px;

      font-weight: 600;

      transition: 0.25s ease;
    }

    .button:hover {
      transform: translateY(-3px);

      border-color:
        rgba(167, 139, 250, 0.45);

      box-shadow:
        0 12px 35px
        rgba(124, 58, 237, 0.15);
    }

    .button.primary {
      border-color: transparent;

      background:
        linear-gradient(
          135deg,
          var(--purple-dark),
          #2563eb
        );
    }


    /* =========================================================
       SECTIONS
    ========================================================= */

    section {
      padding: 82px 0;
    }

    .section-title {
      display: flex;

      align-items: center;

      gap: 12px;

      margin-bottom: 30px;

      font-size: 28px;
    }

    .section-title span {
      color: var(--purple);

      font:
        700 15px "Fira Code",
        monospace;
    }

    .card {
      position: relative;

      padding: 25px;

      overflow: hidden;

      background: var(--card);

      border:
        1px solid var(--border);

      border-radius: var(--radius);

      backdrop-filter: blur(14px);

      transition: 0.25s ease;
    }

    .card:hover {
      background: var(--card-hover);

      border-color:
        rgba(167, 139, 250, 0.3);

      transform: translateY(-3px);
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid {
      display: grid;

      grid-template-columns:
        1.3fr 0.7fr;

      gap: 20px;
    }

    .terminal {
      overflow: hidden;

      background: #05070c;

      border:
        1px solid
        rgba(255, 255, 255, 0.06);

      border-radius: 14px;
    }

    .terminal-head {
      display: flex;

      gap: 7px;

      padding: 12px;

      background: #0d111c;
    }

    .terminal-head i {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      background: #475569;
    }

    .terminal-body {
      padding: 20px;

      color: var(--muted);

      font:
        13px/1.8
        "Fira Code",
        monospace;
    }

    .purple {
      color: var(--purple);
    }

    .cyan {
      color: var(--cyan);
    }

    .green {
      color: var(--green);
    }

    .facts {
      display: grid;

      gap: 13px;
    }

    .fact {
      display: flex;

      justify-content: space-between;

      gap: 18px;

      padding-bottom: 13px;

      border-bottom:
        1px solid
        rgba(255, 255, 255, 0.05);
    }

    .fact:last-child {
      border-bottom: 0;

      padding-bottom: 0;
    }

    .fact span:first-child {
      color: var(--muted);
    }

    .fact span:last-child {
      color: var(--purple);

      text-align: right;
    }


    /* =========================================================
       STACK
    ========================================================= */

    .stack {
      text-align: center;
    }

    .stack img {
      display: block;

      width: 100%;
    }

    .custom-tags {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 22px;
    }

    .tag {
      padding: 5px 10px;

      color: var(--purple);

      background:
        rgba(167, 139, 250, 0.08);

      border:
        1px solid
        rgba(167, 139, 250, 0.13);

      border-radius: 8px;

      font:
        11px "Fira Code",
        monospace;
    }


    /* =========================================================
       PROJECTS
    ========================================================= */

    .projects {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    .project::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      right: -80px;
      top: -80px;

      background: var(--purple);

      filter: blur(100px);

      opacity: 0.07;
    }

    .project-icon {
      margin-bottom: 12px;

      font-size: 35px;
    }

    .project h3 {
      margin-bottom: 8px;
    }

    .project p {
      min-height: 66px;

      margin-bottom: 18px;

      color: var(--muted);

      font-size: 14px;
    }

    .project .tags {
      display: flex;

      flex-wrap: wrap;

      gap: 7px;
    }

    .project-link {
      display: inline-block;

      margin-top: 20px;

      color: var(--cyan);

      font-size: 13px;

      font-weight: 600;
    }


    /* =========================================================
       STATS
    ========================================================= */

    .stats {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    .stats .card {
      display: flex;

      align-items: center;

      justify-content: center;

      min-height: 210px;
    }

    .stats img {
      width: 100%;

      border-radius: 12px;
    }


    /* =========================================================
       STREAK
    ========================================================= */

    .streak-card {
      text-align: center;
    }

    .streak-card img {
      width:
        min(850px, 100%);
    }


    /* =========================================================
       ACTIVITY
    ========================================================= */

    .activity img {
      display: block;

      width: 100%;

      border-radius: 13px;
    }


    /* =========================================================
       SNAKE
    ========================================================= */

    .snake {
      padding: 22px;
    }

    .snake-wrap {
      width: 100%;

      overflow-x: auto;

      scrollbar-width: thin;
    }

    .snake img {
      display: block;

      min-width: 700px;

      width: 100%;
    }


    /* =========================================================
       LISTENING
    ========================================================= */

    .listening {
      display: flex;

      align-items: center;

      gap: 16px;
    }

    .music-icon {
      flex: 0 0 52px;

      width: 52px;
      height: 52px;

      display: grid;

      place-items: center;

      background:
        linear-gradient(
          135deg,
          var(--purple-dark),
          var(--cyan)
        );

      border-radius: 14px;

      font-size: 24px;
    }

    .listening small {
      display: block;

      margin-bottom: 3px;

      color: var(--muted);

      text-transform: uppercase;

      letter-spacing: 1px;

      font-size: 10px;
    }

    .listening strong {
      font-size: 16px;
    }


    /* =========================================================
       SOCIALS
    ========================================================= */

    .socials {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 10px;
    }

    .social {
      padding: 11px 17px;

      color: var(--muted);

      background:
        rgba(17, 24, 39, 0.6);

      border:
        1px solid var(--border);

      border-radius: 12px;

      transition: 0.2s ease;
    }

    .social:hover {
      color: white;

      border-color: var(--purple);

      transform: translateY(-3px);
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      padding: 75px 0 30px;

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }

    .footer-logo {
      margin-bottom: 10px;

      color: var(--purple);

      font-size: 26px;

      font-weight: 700;
    }

    .footer-links {
      display: flex;

      justify-content: center;

      flex-wrap: wrap;

      gap: 12px;

      margin: 18px 0;
    }

    .footer-links a {
      color: var(--muted);
    }

    .footer-links a:hover {
      color: var(--purple);
    }


    /* =========================================================
       REVEAL ANIMATION
    ========================================================= */

    .reveal {
      opacity: 1;

      transform:
        translateY(18px);

      transition:
        opacity 0.65s ease,
        transform 0.65s ease;
    }

    .reveal.visible {
      opacity: 1;

      transform:
        translateY(0);
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 750px) {

      nav {
        justify-content: flex-start;

        overflow-x: auto;

        scrollbar-width: none;
      }

      nav::-webkit-scrollbar {
        display: none;
      }

      nav a {
        white-space: nowrap;
      }

      .hero {
        min-height: 76vh;

        padding-top: 70px;
      }

      .hero h1 {
        letter-spacing: -3px;

        padding-bottom: 14px;
      }

      .about-grid,
      .projects,
      .stats {
        grid-template-columns: 1fr;
      }

      .project p {
        min-height: 0;
      }

      section {
        padding: 62px 0;
      }

      .section-title {
        font-size: 24px;
      }

      .card {
        padding: 20px;
      }
    }


    /* =========================================================
       REDUCED MOTION
    ========================================================= */

    @media (prefers-reduced-motion: reduce) {

      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation: none !important;

        transition: none !important;
      }
    }

  </style>
</head>
